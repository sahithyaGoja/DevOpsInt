<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Create an Account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef2ff, #f8fafc 55%, #e0f2fe);
    }

    .card {
      width: min(100%, 440px);
      padding: clamp(24px, 6vw, 36px);
      background: #fff;
      border: 1px solid #e7eaf1;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgb(23 32 51 / 10%);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 26px; color: #65708a; line-height: 1.5; }
    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd2df;
      border-radius: 9px;
      color: inherit;
      background: #fff;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(79 70 229 / 18%);
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: #4f46e5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #4338ca; }
    button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    #message { min-height: 1.5em; margin: 14px 0 0; color: #187044; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create an account</h1>
    <p class="intro">Fill in your details to get started.</p>

    <form id="registration-form">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-help" required>
        <small id="password-help">Use at least 8 characters.</small>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit">Register</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const password = document.querySelector("#password");
    const confirmPassword = document.querySelector("#confirm-password");
    const message = document.querySelector("#message");

    function validatePasswords() {
      confirmPassword.setCustomValidity(
        confirmPassword.value && password.value !== confirmPassword.value
          ? "Passwords do not match."
          : ""
      );
    }

    password.addEventListener("input", validatePasswords);
    confirmPassword.addEventListener("input", validatePasswords);

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      validatePasswords();

      if (!form.reportValidity()) {
        message.style.color = "#b42318";
        message.textContent = "Please check the form and try again.";
        return;
      }

      message.style.color = "#187044";
      message.textContent = "Form validated! Connect this page to a backend to create an account.";
    });
  </script>
</body>
</html>
