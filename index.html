<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f2f5fb;
    }

    .card {
      width: min(100%, 420px);
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgb(23 32 51 / 10%);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 24px; color: #65708a; }
    .field { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd2df;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(79 70 229 / 20%);
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #4f46e5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #4338ca; }
    #message { min-height: 1.5em; margin: 14px 0 0; color: #187044; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create an account</h1>
    <p class="intro">Fill in your details to get started.</p>

    <form id="registration-form">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit">Register</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const password = document.querySelector("#password").value;
      const confirmPassword = document.querySelector("#confirm-password").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.color = "#b42318";
        return;
      }

      message.style.color = "#187044";
      message.textContent = "Form validated! Connect this page to a backend to create an account.";
    });
  </script>
</body>
</html>
